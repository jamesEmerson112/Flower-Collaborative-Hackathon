[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-nodes"
version = "0.1.0"
description = "The master greets every SuperNode; each node answers from its own local profile"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["hello_app"]

[tool.flwr.app]
publisher = "zerocks2503"   # Flower account username (owner of SuperNode_James)
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["hello_app/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "hello_app.agent_app:app"
